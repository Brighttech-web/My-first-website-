<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Resizer | Bright Dev</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="tool-header">
    <a href="index.html" class="logo">Bright<span>Dev</span></a>
    <a href="index.html" class="back-btn">← Back Home</a>
  </header>

  <main class="tool-page">

    <section class="tool-intro">
      <h1>Image Resizer</h1>
      <p>Resize your images quickly and easily with Bright Dev.</p>
    </section>

    <section class="resizer-card">

      <label for="imageInput" class="upload-box">
        <div class="upload-icon">📷</div>
        <h2>Choose an Image</h2>
        <p>Click here to upload your image</p>
        <input type="file" id="imageInput" accept="image/*">
      </label>

      <div id="previewArea" class="preview-area" style="display:none;">

        <img id="imagePreview" alt="Image Preview">

        <div class="size-controls">

          <div class="input-group">
            <label for="width">Width</label>
            <input type="number" id="width">
          </div>

          <div class="input-group">
            <label for="height">Height</label>
            <input type="number" id="height">
          </div>

        </div>

        <label class="checkbox-label">
          <input type="checkbox" id="lockRatio" checked>
          Keep aspect ratio
        </label>

        <button id="resizeBtn" class="primary-btn">
          Resize Image
        </button>

        <a id="downloadBtn" class="download-btn" style="display:none;">
          Download Image
        </a>

      </div>

    </section>

  </main>

  <script>
    const imageInput = document.getElementById("imageInput");
    const imagePreview = document.getElementById("imagePreview");
    const previewArea = document.getElementById("previewArea");
    const widthInput = document.getElementById("width");
    const heightInput = document.getElementById("height");
    const lockRatio = document.getElementById("lockRatio");
    const resizeBtn = document.getElementById("resizeBtn");
    const downloadBtn = document.getElementById("downloadBtn");

    let originalWidth = 0;
    let originalHeight = 0;
    let imageFile = null;

    imageInput.addEventListener("change", function () {

      imageFile = this.files[0];

      if (!imageFile) return;

      const reader = new FileReader();

      reader.onload = function (event) {

        imagePreview.src = event.target.result;

        imagePreview.onload = function () {

          originalWidth = imagePreview.naturalWidth;
          originalHeight = imagePreview.naturalHeight;

          widthInput.value = originalWidth;
          heightInput.value = originalHeight;

          previewArea.style.display = "block";
        };
      };

      reader.readAsDataURL(imageFile);
    });

    widthInput.addEventListener("input", function () {

      if (lockRatio.checked && originalWidth) {

        const newWidth = Number(widthInput.value);

        heightInput.value = Math.round(
          newWidth * originalHeight / originalWidth
        );
      }
    });

    heightInput.addEventListener("input", function () {

      if (lockRatio.checked && originalHeight) {

        const newHeight = Number(heightInput.value);

        widthInput.value = Math.round(
          newHeight * originalWidth / originalHeight
        );
      }
    });

    resizeBtn.addEventListener("click", function () {

      if (!imageFile) return;

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      const newWidth = Number(widthInput.value);
      const newHeight = Number(heightInput.value);

      if (newWidth <= 0 || newHeight <= 0) {
        alert("Please enter a valid width and height.");
        return;
      }

      canvas.width = newWidth;
      canvas.height = newHeight;

      ctx.drawImage(
        imagePreview,
        0,
        0,
        newWidth,
        newHeight
      );

      canvas.toBlob(function (blob) {

        const url = URL.createObjectURL(blob);

        downloadBtn.href = url;
        downloadBtn.download = "brightdev-resized-image.png";
        downloadBtn.style.display = "inline-block";

        downloadBtn.textContent = "⬇ Download Resized Image";

      }, "image/png");
    });
  </script>

</body>
</html>
