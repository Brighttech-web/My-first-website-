<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Resizer | BrightDev</title>

    <link rel="stylesheet" href="image-resizer.css">
</head>

<body>

    <div class="resizer-container">

        <a href="index.html" class="back-btn">← Back to BrightDev</a>

        <h1>Image Resizer</h1>

        <p class="subtitle">
            Resize your images quickly and easily.
        </p>

        <div class="upload-box">
            <label for="imageInput" class="upload-label">
                Choose an Image
            </label>

            <input type="file" id="imageInput" accept="image/*">
        </div>

        <div class="preview-container">
            <img id="preview" src="" alt="Image Preview">
        </div>

        <div class="size-controls">

            <div class="input-group">
                <label for="width">Width (px)</label>
                <input type="number" id="width" placeholder="Width">
            </div>

            <div class="input-group">
                <label for="height">Height (px)</label>
                <input type="number" id="height" placeholder="Height">
            </div>

        </div>

        <button id="resizeBtn" class="resize-btn">
            Resize Image
        </button>

        <button id="downloadBtn" class="download-btn" style="display: none;">
            Download Resized Image
        </button>

    </div>

    <script src="image-resizer.js"></script>

</body>
</html>
