<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Resizer | Bright Dev</title>

  <link rel="stylesheet" href="image-resizer.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container nav-container">

      <a href="index.html" class="logo">
        <span>Bright</span>Dev
      </a>

      <a href="index.html" class="back-home">
        ← Back to Home
      </a>

    </div>
  </header>


  <!-- IMAGE RESIZER -->
  <main class="resizer-page">

    <div class="container">

      <div class="page-heading">
        <p class="small-title">BRIGHT DEV TOOL</p>

        <h1>Image Resizer</h1>

        <p>
          Resize your images quickly and easily.
          Upload an image, choose your dimensions and download it.
        </p>
      </div>


      <div class="resizer-box">

        <!-- UPLOAD AREA -->
        <div class="upload-area" id="uploadArea">

          <div class="upload-icon">
            🖼️
          </div>

          <h2>Upload an Image</h2>

          <p>
            Choose an image from your device to get started.
          </p>

          <label for="imageInput" class="upload-btn">
            Choose Image
          </label>

          <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
          >
