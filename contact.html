<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bright Dev | Contact</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f9fc;
            color: #111827;
        }

        header {
            background: #0b1220;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #3b82f6;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }

        .hero {
            text-align: center;
            padding: 70px 7%;
            background: linear-gradient(135deg, #eef5ff, #ffffff);
        }

        .hero h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #2563eb;
        }

        .hero p {
            color: #6b7280;
            font-size: 17px;
            line-height: 1.6;
        }

        .contact-section {
            max-width: 800px;
            margin: 50px auto;
            padding: 0 25px;
        }

        .contact-card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }

        .contact-card h2 {
            margin-bottom: 10px;
        }

        .contact-card p {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .email-button {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 14px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .email-button:hover {
            background: #1d4ed8;
        }

        footer {
            background: #070d18;
            color: #9ca3af;
            text-align: center;
            padding: 30px;
            margin-top: 60px;
        }

        @media (max-width: 800px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 7px;
            }

            .hero h1 {
                font-size: 36px;
            }

            .contact-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        Bright<span>Dev</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="tools.html">Tools</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>


<section class="hero">

    <h1>Contact <span>Bright Dev</span></h1>

    <p>
        Have a question, suggestion or feedback?
        We'd love to hear from you.
    </p>

</section>


<section class="contact-section">

    <div class="contact-card">

        <h2>Send Us a Message</h2>

        <p>
            Have an idea, found a problem, or simply want
            to get in touch? Send Bright Dev a message.
        </p>


        <label for="name">Your Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name">


        <label for="subject">Subject</label>

        <input
            type="text"
            id="subject"
            placeholder="What is this about?">


        <label for="message">Message</label>

        <textarea
            id="message"
            placeholder="Write your message here..."></textarea>


        <a
            class="email-button"
            href="mailto:brightdev.com@gmail.com">
            📧 Email Bright Dev
        </a>

    </div>

</section>


<footer>

    <p>
        © 2026 Bright Dev. All rights reserved.
    </p>

</footer>

</body>
</html>
